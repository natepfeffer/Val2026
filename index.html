<!DOCTYPE html> 
<html> 
<head>
    <title>Certificate of Naming</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Great+Vibes&family=Lora:ital@0;1&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Lora', serif;
            background: radial-gradient(circle at center, #f3e5f5 0%, #e1bee7 100%); /* Subtle Valentine vibe */
            text-align: center;
            padding: 20px;
            min-height: 100vh;
        }
        .certificate {
            border: 8px double #5e2a2a;
            outline: 2px solid #5e2a2a;
            outline-offset: 6px;
            background-color: #fffdf7; /* Parchment look */
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%235e2a2a' fill-opacity='0.03' fill-rule='evenodd'%3E%3Cpath d='M0 40L40 0H20L0 20M40 40V20L20 40'/%3E%3C/g%3E%3C/svg%3E");
            padding: 40px;
            max-width: 900px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
        }
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 56px;
            color: #5e2a2a;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }
        .name {
            font-family: 'Great Vibes', cursive;
            font-size: 72px;
            margin: 10px 0;
            color: #d32f2f;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        .text-content {
            font-size: 24px;
            line-height: 1.5;
            margin-bottom: 30px;
            color: #333;
        }
        .media-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            flex-wrap: wrap;
            margin-top: 40px;
        }
        img, video {
            max-width: 100%;
            height: auto;
            border: 10px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }
        /* Polaroid tilt effect */
        .media-container img {
            transform: rotate(-3deg);
        }
        .media-container video {
            transform: rotate(3deg);
        }
        .media-container img:hover, .media-container video:hover {
            transform: scale(1.05) rotate(0deg);
            z-index: 10;
        }
        /* Official Seal CSS */
        .seal {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 120px;
            height: 120px;
            background: #c5a059;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 4px dashed #fff;
            color: #fff;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            transform: rotate(-15deg);
            opacity: 0.9;
        }
        .receipt-section {
            margin-top: 50px;
            opacity: 0.8;
            filter: grayscale(100%);
            transition: filter 0.3s;
        }
        .receipt-section:hover {
            filter: grayscale(0%);
        }
    </style>
</head>
<body> 

<div class="certificate">
    <!-- CSS Seal added here -->
    <div class="seal">OFFICIAL<br>ROACH<br>REGISTRY</div>

    <h1>Certificate of Naming</h1>
    <p style="font-size: 18px; font-style: italic;">San Antonio Zoo</p>
    
    <div class="text-content">
        <p>This document officially certifies that</p>
        <div class="name">Cloe Nader</div>
        <p>is the namesake of a Madagascar Hissing Cockroach.</p>
    </div>

    <div class="media-container">
        <!-- Embedded Video -->
        <video width="400" controls>
            <source src="roach2.mp4" type="video/mp4">
            Your browser does not support HTML video.
        </video>
        
        <!-- Embedded Card Image -->
        <img src="Cockroach - Valentine's Day Card.jpg" alt="Valentine's Card" width="400">
    </div>
</div>

<div class="receipt-section">
    <h3>Proof of Purchase</h3>
    <!-- Replace 'receipt.jpg' with your actual receipt filename -->
    <img src="valreceipt.png" alt="Receipt Image" width="500">
</div>

</body> 
</html>
